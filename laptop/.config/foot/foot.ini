shell=/usr/bin/fish
# theme: font /^font=(.*):size=/ font-size /(\d+)$/
font=Source Code Pro:size=13
dpi-aware=no
resize-by-cells=no
underline-offset=2px

[scrollback]
lines=20000

[bell]
notify=yes

[colors-dark]
foreground=E5E5E5 # theme: grey2
background=333333 # theme: background
cursor=333333 E5E5E5 # theme: background grey2
regular0=404040 # theme: grey7
regular1=FF6467 # theme: red
regular2=05DF72 # theme: green
regular3=FDC700 # theme: yellow
regular4=7C86FF # theme: blue
regular5=ED6AFF # theme: magenta
regular6=00D3F2 # theme: cyan
regular7=D4D4D4 # theme: grey3
bright0=A1A1A1 # theme: grey4
bright1=FFA2A2 # theme: brred
bright2=7BF1A8 # theme: brgreen
bright3=FFDF20 # theme: bryellow
bright4=A3B3FF # theme: brblue
bright5=F4A8FF # theme: brmagenta
bright6=53EAFD # theme: brcyan
bright7=F5F5F5 # theme: grey1

[colors-light]
foreground=333333 # theme: background
background=F5F5F5 # theme: grey1
cursor=F5F5F5 333333 # theme: grey1 background
regular0=404040 # theme: grey7
regular1=E7000B # theme: light-red
regular2=00A63E # theme: light-green
regular3=D08700 # theme: light-yellow
regular4=4F39F6 # theme: light-blue
regular5=C800DE # theme: light-magenta
regular6=0092B8 # theme: light-cyan
regular7=737373 # theme: grey5
bright0=525252 # theme: grey6
bright1=FB2C36 # theme: light-brred
bright2=00C950 # theme: light-brgreen
bright3=F0B100 # theme: light-bryellow
bright4=615FFF # theme: light-brblue
bright5=E12AFB # theme: light-brmagenta
bright6=00B8DB # theme: light-brcyan
bright7=A1A1A1 # theme: grey4

[key-bindings]
unicode-input=none
show-urls-launch=Control+Shift+j
show-urls-copy=Control+Shift+u
show-urls-persistent=none
pipe-command-output=[wl-copy -n] Control+Shift+l
clipboard-copy=XF86Copy
pipe-selected=[sh -c "sed 's/[[:space:]]*$//' | wl-copy -n"] Control+Shift+c

[desktop-notifications]
command=foot-notify --replace-id ${replace-id} --print-id ${action-argument} -- ${title} ${body}
command-action-argument=--action ${action-name}=${action-label}
