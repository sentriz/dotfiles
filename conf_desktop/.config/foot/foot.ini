shell=/usr/bin/fish
# theme: font /^font=(.*):size=/
font=Source Code Pro:size=13
dpi-aware=no

[scrollback]
lines=20000

[bell]
notify=yes

[colors-dark]
foreground=E5E5E5 # theme: grey200
background=353535 # theme: background
cursor=353535 E5E5E5 # theme: background grey200
regular0=525252 # theme: grey600
regular1=FF6568 # theme: term1
regular2=05DF72 # theme: term2
regular3=F7C902 # theme: term3
regular4=57A2FF # theme: term4
regular5=EC6DFF # theme: term5
regular6=02D1EC # theme: term6
regular7=D4D4D4 # theme: grey300
bright0=A1A1A1 # theme: grey400
bright1=FFA3A4 # theme: term9
bright2=7BF1A8 # theme: term10
bright3=FFE031 # theme: term11
bright4=91C5FF # theme: term12
bright5=F2A9FF # theme: term13
bright6=53EAFD # theme: term14
bright7=E5E5E5 # theme: grey200

[colors-light]
foreground=353535 # theme: background
background=F5F5F5 # theme: grey100
cursor=F5F5F5 353535 # theme: grey100 background
regular0=404040 # theme: grey700
regular1=E30117 # theme: light1
regular2=02A447 # theme: light2
regular3=CA8A01 # theme: light3
regular4=155DFC # theme: light4
regular5=C501DA # theme: light5
regular6=0291B2 # theme: light6
regular7=737373 # theme: grey500
bright0=525252 # theme: grey600
bright1=FB2C36 # theme: light9
bright2=01C65A # theme: light10
bright3=EAB302 # theme: light11
bright4=3280FF # theme: light12
bright5=E12AFB # theme: light13
bright6=04B6D4 # theme: light14
bright7=A1A1A1 # theme: grey400

[key-bindings]
unicode-input=none
show-urls-launch=Control+Shift+j
show-urls-copy=Control+Shift+u
show-urls-persistent=none
pipe-command-output=[wl-copy -n] Control+Shift+l

[desktop-notifications]
command=foot-notify ${action-argument} -- ${title} ${body}
command-action-argument=--action ${action-name}=${action-label}
